<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MashupSquad Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 flex flex-col items-center justify-center">

  <!-- 🔒 LOGIN FORM SCREEN -->
  <div id="loginBox" class="w-full max-w-md bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-sky-400">🏆 Admin Access</h1>
      <p class="text-sm text-gray-400 mt-1">Please login to access tournament control</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Username</label>
        <input type="text" id="adminUser" placeholder="Enter Username" required class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-sky-400">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Password</label>
        <input type="password" id="adminPass" placeholder="Enter Password" required class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-sky-400">
      </div>

      <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 font-bold py-2.5 rounded-lg transition duration-200">
        Login to Dashboard
      </button>
    </form>
    
    <div id="loginError" class="mt-4 text-center text-sm font-semibold text-red-400 hidden">
      ❌ Invalid Username or Password!
    </div>
  </div>

  <!-- 📊 ADMIN DASHBOARD SCREEN -->
  <div id="dashboardBox" class="w-full max-w-6xl bg-gray-800 p-6 rounded-lg shadow-xl hidden">
    
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-sky-400">🏆 MashupSquad Registration & Stats Management</h1>
      <button onclick="logoutAdmin()" class="bg-gray-700 hover:bg-gray-600 text-xs text-gray-300 px-3 py-1.5 rounded-lg border border-gray-600 transition">
        🔒 Logout
      </button>
    </div>

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold text-gray-200">Player Registrations</h2>
      <div id="statusMsg" class="text-sm font-semibold hidden"></div>
    </div>

    <!-- Live Data Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-gray-700 text-sky-300">
            <th class="p-3 border border-gray-600">Name</th>
            <th class="p-3 border border-gray-600">Game ID</th>
            <th class="p-3 border border-gray-600">Game</th>
            <th class="p-3 border border-gray-600">Status</th>
            <th class="p-3 border border-gray-600 text-center">Matches</th>
            <th class="p-3 border border-gray-600 text-center">Kills</th>
            <th class="p-3 border border-gray-600 text-center">Wins</th>
            <th class="p-3 border border-gray-600 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="playerTableBody">
          <tr><td colspan="8" class="p-4 text-center text-gray-400">Loading registrations...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase Firestore Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const USERNAME = "Zee123";
    const PASSWORD = "zeesho0o@";

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('adminUser').value;
      const pass = document.getElementById('adminPass').value;

      if (user === USERNAME && pass === PASSWORD) {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dashboardBox').classList.remove('hidden');
        document.body.classList.remove('flex', 'items-center', 'justify-center');
        loadFirebaseData();
      } else {
        const errDiv = document.getElementById('loginError');
        errDiv.classList.remove('hidden');
        setTimeout(() => errDiv.classList.add('hidden'), 3000);
      }
    });

    window.logoutAdmin = function() {
      location.reload();
    };

    const firebaseConfig = {
      apiKey: "AIzaSyCM4tIhi69IzdYwMQ1lRhoG1-J8cc1IuWk",
      authDomain: "gamingtournaments-6674d.firebaseapp.com",
      projectId: "gamingtournaments-6674d",
      storageBucket: "gamingtournaments-6674d.firebasestorage.app",
      messagingSenderId: "429975429685",
      appId: "1:429975429685:web:73c0914152581e99a2477c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const regCollection = collection(db, 'registrations');

    function loadFirebaseData() {
      onSnapshot(regCollection, (snapshot) => {
        const tableBody = document.getElementById('playerTableBody');
        tableBody.innerHTML = '';

        if (!snapshot.empty) {
          snapshot.forEach((docSnap) => {
            const id = docSnap.id;
            const data = docSnap.data();
            const status = data.status || 'Pending';

            const matches = data.matches || 0;
            const kills = data.kills || 0;
            const wins = data.wins || 0;

            let statusBadge = `<span class="bg-yellow-500/20 text-yellow-400 text-xs px-2 py-1 rounded border border-yellow-500/40 font-semibold">Pending</span>`;
            if (status === 'Approved') {
              statusBadge = `<span class="bg-green-500/20 text-green-400 text-xs px-2 py-1 rounded border border-green-500/40 font-semibold">Approved</span>`;
            } else if (status === 'Rejected') {
              statusBadge = `<span class="bg-red-500/20 text-red-400 text-xs px-2 py-1 rounded border border-red-500/40 font-semibold">Rejected</span>`;
            }

            const row = `
              <tr class="border-b border-gray-700 hover:bg-gray-750">
                <td class="p-3 font-medium">${data.name || 'N/A'}</td>
                <td class="p-3 font-mono text-yellow-400">${data.game_id || 'N/A'}</td>
                <td class="p-3">${data.game || 'N/A'}</td>
                <td class="p-3">${statusBadge}</td>
                <td class="p-2 text-center">
                  <input type="number" value="${matches}" id="m_${id}" class="w-14 bg-gray-700 border border-gray-600 rounded text-center p-1 text-xs">
                </td>
                <td class="p-2 text-center">
                  <input type="number" value="${kills}" id="k_${id}" class="w-14 bg-gray-700 border border-gray-600 rounded text-center p-1 text-xs">
                </td>
                <td class="p-2 text-center">
                  <input type="number" value="${wins}" id="w_${id}" class="w-14 bg-gray-700 border border-gray-600 rounded text-center p-1 text-xs">
                </td>
                <td class="p-3 flex gap-1 justify-center items-center">
                  <button onclick="saveStats('${id}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2 py-1 rounded font-semibold transition" title="Save Stats">💾 Save Stats</button>
                  <button onclick="updateStatus('${id}', 'Approved')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-2 py-1 rounded font-semibold transition">Approve</button>
                  <button onclick="updateStatus('${id}', 'Rejected')" class="bg-yellow-600 hover:bg-yellow-700 text-white text-xs px-2 py-1 rounded font-semibold transition">Reject</button>
                  <button onclick="deleteRegistration('${id}')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2.5 py-1 rounded font-semibold transition">Delete</button>
                </td>
              </tr>
            `;
            tableBody.innerHTML += row;
          });
        } else {
          tableBody.innerHTML = '<tr><td colspan="8" class="p-4 text-center text-gray-400">No registrations found</td></tr>';
        }
      });
    }

    // Save Stats (Matches, Kills, Wins)
    window.saveStats = async function(id) {
      try {
        const matches = parseInt(document.getElementById(`m_${id}`).value) || 0;
        const kills = parseInt(document.getElementById(`k_${id}`).value) || 0;
        const wins = parseInt(document.getElementById(`w_${id}`).value) || 0;

        const docRef = doc(db, 'registrations', id);
        await updateDoc(docRef, { matches, kills, wins });
        showStatus("✅ Stats updated successfully!", "text-green-400");
      } catch (e) {
        showStatus("Error updating stats: " + e.message, "text-red-400");
      }
    };

    // Action Functions
    window.updateStatus = async function(id, newStatus) {
      try {
        const docRef = doc(db, 'registrations', id);
        await updateDoc(docRef, { status: newStatus });
        showStatus(`Status updated to ${newStatus}`, "text-green-400");
      } catch (e) {
        showStatus("Error updating: " + e.message, "text-red-400");
      }
    };

    window.deleteRegistration = async function(id) {
      if (confirm("Are you sure you want to delete this registration?")) {
        try {
          await deleteDoc(doc(db, 'registrations', id));
          showStatus("Registration deleted", "text-red-400");
        } catch (e) {
          showStatus("Error deleting: " + e.message, "text-red-400");
        }
      }
    };

    function showStatus(msg, colorClass) {
      const msgDiv = document.getElementById('statusMsg');
      msgDiv.textContent = msg;
      msgDiv.className = `text-sm font-semibold ${colorClass}`;
      msgDiv.classList.remove('hidden');
      setTimeout(() => msgDiv.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
