<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MashupSquad Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">

  <div class="max-w-5xl mx-auto bg-gray-800 p-6 rounded-lg shadow-xl">
    <h1 class="text-2xl font-bold text-sky-400 mb-6 text-center">🏆 MashupSquad Registration Management</h1>

    <!-- Status Filter -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold text-gray-200">Player Registrations</h2>
      <div id="statusMsg" class="text-sm font-semibold hidden"></div>
    </div>

    <!-- Live Data Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-700 text-sky-300">
            <th class="p-3 border border-gray-600">Name</th>
            <th class="p-3 border border-gray-600">Game ID</th>
            <th class="p-3 border border-gray-600">Phone</th>
            <th class="p-3 border border-gray-600">Game</th>
            <th class="p-3 border border-gray-600">Status</th>
            <th class="p-3 border border-gray-600 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="playerTableBody">
          <tr><td colspan="6" class="p-4 text-center text-gray-400">Loading registrations...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase Firestore Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 Step: Apni Firebase Config Keys Yahan Paste Karein
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "GamingTournaments",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const regCollection = collection(db, 'registrations');

    // Fetch Registrations in Real-time
    onSnapshot(regCollection, (snapshot) => {
      const tableBody = document.getElementById('playerTableBody');
      tableBody.innerHTML = '';

      if (!snapshot.empty) {
        snapshot.forEach((docSnap) => {
          const id = docSnap.id;
          const data = docSnap.data();
          const status = data.status || 'Pending';

          let statusBadge = `<span class="bg-yellow-500/20 text-yellow-400 text-xs px-2 py-1 rounded border border-yellow-500/40">Pending</span>`;
          if (status === 'Approved') {
            statusBadge = `<span class="bg-green-500/20 text-green-400 text-xs px-2 py-1 rounded border border-green-500/40">Approved</span>`;
          } else if (status === 'Rejected') {
            statusBadge = `<span class="bg-red-500/20 text-red-400 text-xs px-2 py-1 rounded border border-red-500/40">Rejected</span>`;
          }

          const row = `
            <tr class="border-b border-gray-700 hover:bg-gray-750">
              <td class="p-3 font-medium">${data.name || 'N/A'}</td>
              <td class="p-3 font-mono text-yellow-400">${data.game_id || 'N/A'}</td>
              <td class="p-3 font-mono text-gray-300">${data.phone || 'N/A'}</td>
              <td class="p-3">${data.game || 'N/A'}</td>
              <td class="p-3">${statusBadge}</td>
              <td class="p-3 flex gap-2 justify-center">
                <button onclick="updateStatus('${id}', 'Approved')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-2 py-1 rounded font-semibold transition">Approve</button>
                <button onclick="updateStatus('${id}', 'Rejected')" class="bg-yellow-600 hover:bg-yellow-700 text-white text-xs px-2 py-1 rounded font-semibold transition">Reject</button>
                <button onclick="deleteRegistration('${id}')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded font-semibold transition">Delete</button>
              </td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });
      } else {
        tableBody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-400">No registrations found</td></tr>';
      }
    });

    // Action Functions
    window.updateStatus = async function(id, newStatus) {
      try {
        const docRef = doc(db, 'registrations', id);
        await updateDoc(docRef, { status: newStatus });
        showStatus(`Status updated to ${newStatus}`, "text-green-400");
      } catch (e) {
        showStatus("Error updating: " + e.message, "text-red-400");
      }
    };

    window.deleteRegistration = async function(id) {
      if (confirm("Are you sure you want to delete this registration?")) {
        try {
          await deleteDoc(doc(db, 'registrations', id));
          showStatus("Registration deleted", "text-red-400");
        } catch (e) {
          showStatus("Error deleting: " + e.message, "text-red-400");
        }
      }
    };

    function showStatus(msg, colorClass) {
      const msgDiv = document.getElementById('statusMsg');
      msgDiv.textContent = msg;
      msgDiv.className = `text-sm font-semibold ${colorClass}`;
      msgDiv.classList.remove('hidden');
      setTimeout(() => msgDiv.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
